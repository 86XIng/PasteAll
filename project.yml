name: PasteAll
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.6.0
  libxlsxwriter:
    url: https://github.com/jmcnamara/libxlsxwriter.git
    from: 1.2.4
targets:
  PasteAllCore:
    type: framework
    platform: macOS
    sources: [Sources/PasteAllCore]
    dependencies:
      - package: SwiftSoup
      - package: libxlsxwriter
    settings:
      base:
        PASTEALL_CORE_BUNDLE_ID: com.local.PasteAllCore
        PRODUCT_BUNDLE_IDENTIFIER: $(PASTEALL_CORE_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.0
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  PasteAll:
    type: application
    platform: macOS
    sources:
      - path: Sources/PasteAll
        excludes: [Resources]
      - path: Sources/PasteAll/Resources
        buildPhase: resources
    dependencies:
      - target: PasteAllCore
    settings:
      base:
        PASTEALL_APP_BUNDLE_ID: com.local.PasteAll
        PRODUCT_BUNDLE_IDENTIFIER: $(PASTEALL_APP_BUNDLE_ID)
        PRODUCT_NAME: PasteAll
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: PasteAll
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: 5.0
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  PasteAllCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/PasteAllCoreTests]
    dependencies:
      - target: PasteAllCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.PasteAllCoreTests
        GENERATE_INFOPLIST_FILE: YES
  PasteAllTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/PasteAllTests]
    dependencies:
      - target: PasteAll
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.PasteAllTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PasteAll:
    build:
      targets:
        PasteAll: all
        PasteAllCoreTests: [test]
        PasteAllTests: [test]
    test:
      targets:
        - PasteAllCoreTests
        - PasteAllTests
